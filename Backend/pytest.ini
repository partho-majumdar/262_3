[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    security: SSRF / URL-validation defence tests
    models: tensor-shape, checkpoint and inference tests
    slow: tests that take more than a few seconds
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
